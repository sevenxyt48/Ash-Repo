# Copy this file into your assignment repo as .github/workflows/check.yml
# and push. From then on every push gets a tick or a cross on GitHub, and the
# Actions tab shows the same checklist `uv run check.py` prints on your machine.
name: Assignment check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: sd5913/pfad/.github/workflows/check-assignment.yml@2026
    with:
      assignment: "1"
