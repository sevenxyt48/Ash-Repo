# Reusable check for SD5913 assignment repos. Students do not edit this file —
# they add assignments/check.yml to their own repo, which calls this one.
#
# It runs assignments/check.py from the 2026 branch against the calling repo,
# so fixing the checker here fixes it for everyone on their next push.
name: Check assignment

on:
  workflow_call:
    inputs:
      assignment:
        description: Which assignment's spec to check against
        type: string
        default: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out your repository, with its history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch the checker from the course repo
        run: curl -fsSL https://raw.githubusercontent.com/sd5913/pfad/2026/assignments/check.py -o /tmp/check.py

      - name: Check
        env:
          ASSIGNMENT_REPO_PRIVATE: ${{ github.event.repository.private }}
        run: python3 /tmp/check.py --assignment "${{ inputs.assignment }}"
